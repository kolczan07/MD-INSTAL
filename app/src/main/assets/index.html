<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Instalatorek</title>
<style>
:root{--bg:#0f1720;--btn:rgba(217,115,58,.92);--btnink:#fff;box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;}
.stage{position:relative;width:min(100vw, 800px);max-width:100%;aspect-ratio:800/340;margin-top:2vh;border:2px solid #2a3a4a;border-radius:8px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.5);}
canvas{width:100%;height:100%;display:block;}

.controls{position:relative;width:min(100vw, 800px);display:flex;justify-content:space-between;padding:10px 20px;box-sizing:border-box;margin-top:5px; height:120px;}
.left-btns{display:flex;gap:15px;align-items:center;}
.right-btns{display:flex;gap:15px;align-items:center;}

.b{width:75px;height:75px;border:0;border-radius:50%;background:var(--btn);color:var(--btnink);font:700 30px "Trebuchet MS",system-ui,sans-serif;touch-action:none;box-shadow:0 4px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;}
.b:active{filter:brightness(1.3);transform:scale(0.95);}
#f{background:rgba(242,201,76,.9);color:#222;}
#j{width: 85px; height: 85px; font-size: 34px;}
</style>
</head>
<body>
<div class="stage" id="s">
<canvas id="c" width="800" height="340"></canvas>
</div>

<div class="controls">
  <div class="left-btns">
    <button class="b" id="l" aria-label="W lewo">◀</button>
    <button class="b" id="r" aria-label="W prawo">▶</button>
  </div>
  <div class="right-btns">
    <button class="b" id="f" aria-label="Piorun">⚡</button>
    <button class="b" id="j" aria-label="Skok">▲</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=800,H=340,LEN=3500,keys={l:0,r:0,j:0,f:0}
const GR=0.28; 

const goal={x:3340,y:190,w:70,h:90}; 
const logo=new Image();logo.src='logo.png';
const geoecoLogo=new Image();geoecoLogo.src='geoeco.png';

let st='select', cam=0, score=0, lives=3, p, coins, en, boxes=[], items=[], bolts=[], t=0, cp=10, level=0, cutscene=0, boss=null, bossBolts=[], bossDying=0;
let levelStartTimer=0;
let solids=[]; 

let world = 1; 
let winAnimTimer = 0;

let bossDefeated = false;
let valveX = 700; 
let valveY = 160;
let valveAngle = 0;
let waterTimer = 10;

let repairing = false;
let repairTimer = 0;

let speedBoostTimer = 0;
let magnetTimer = 0;

let selectedChar = 0; 
let highScores = [0, 0, 0]; 

try {
    let saved = localStorage.getItem('instalatorek_scores');
    if(saved) highScores = JSON.parse(saved);
} catch(e) {}

function saveHighScore() {
    if (score > highScores[selectedChar]) {
        highScores[selectedChar] = score;
        try {
            localStorage.setItem('instalatorek_scores', JSON.stringify(highScores));
        } catch(e) {}
    }
}

function getEnvColors() {
    if (world === 1) return { skyTop:'#14283d', skyBot:'#3a6a8f', bld:'#1b3550', grnd:'#2a2f38' };
    if (world === 2) return { skyTop:'#0f2417', skyBot:'#2e6a46', bld:'#143d24', grnd:'#1c2b20' }; 
    return { skyTop:'#2b1111', skyBot:'#8f3a3a', bld:'#3d1414', grnd:'#2b1c1c' }; 
}

function generateLevel() {
  solids = []; coins = []; en = []; boxes = []; items = []; bolts = [];
  let cx = 0;
  while (cx < LEN) {
    let width = 300 + Math.random() * 200; 
    if (cx + width > LEN) width = LEN - cx;
    
    solids.push({x: cx, y: 280, w: width, h: 60, g: 1});
    
    let obsX = -1000;
    if (Math.random() > 0.4 && width > 200) {
       obsX = cx + 120 + Math.random() * (width - 200);
       let obsH = 30 + Math.random() * 30;
       solids.push({x: obsX, y: 280 - obsH, w: 40, h: obsH, g: 0, isBox: 1});
    }

    let numPlat = Math.floor(Math.random() * 2);
    for (let i = 0; i < numPlat; i++) {
      let px = cx + 50 + Math.random() * (width - 150);
      let py = 140 + Math.random() * 80; 
      let pw = 90 + Math.random() * 50;
      solids.push({x: px, y: py, w: pw, h: 14});
      
      if (Math.random() > 0.5) {
          coins.push({x: px + pw/2, y: py - 30, got: 0});
      }
    }

    if (Math.random() > 0.5) {
        let bx = cx + 100 + Math.random() * (width - 200);
        let by = 230 + Math.random() * 20; 
        boxes.push({x: bx, y: by, w: 30, h: 30, broken: false, dropCoins: 10, anim: 0});
    }

    // ITEMY (wiszące w powietrzu, nie na ziemi)
    if (Math.random() > 0.8) {
        let ix = cx + 100 + Math.random() * (width - 200);
        let iy = 150 + Math.random() * 40; // Wysoko zawieszone
        let iType = Math.floor(Math.random() * 3); 
        items.push({x: ix, y: iy, baseY: iy, type: iType, w: 24, h: 24, got: false});
    }

    let numEn = 1 + Math.floor(Math.random() * (1 + level / 3));
    for (let i = 0; i < numEn; i++) {
      let ex = cx + 50 + Math.random() * (width - 100);
      en.push({x: ex, y: 258, a: cx + 10, b: cx + width - 40, d: Math.random() > 0.5 ? 1 : -1, dead: 0});
    }
    
    if (Math.random() > 0.3) {
        let safeX;
        let safe = false;
        let attempts = 0;
        while(!safe && attempts < 10) {
            safeX = cx + 40 + Math.random() * (width - 80);
            if (Math.abs(safeX - (obsX + 20)) > 50) safe = true;
            attempts++;
        }
        if (safe) coins.push({x: safeX, y: 240, got: 0});
    }

    cx += width + 80 + Math.random() * 30; 
  }
}

function init(){   
  levelStartTimer = 150; 
  bossDefeated = false;
  valveAngle = 0;
  repairing = false;
  repairTimer = 0;
  waterTimer = 10;
  speedBoostTimer = 0;
  magnetTimer = 0;

  if(level % 4 === 3){     
    coins=[];en=[];boxes=[];items=[];bolts=[];bossBolts=[];bossDying=0;     
    solids = [
      {x:0, y:280, w:800, h:60, g:1}, 
      {x:80, y:180, w:150, h:14},     
      {x:550, y:180, w:100, h:14}
    ];
    cp = 20;
    respawn();
    let bossHp = 30 + Math.floor(world) * 15; 
    boss = { x: 300, y: 20, w: 120, h: 80, hp: bossHp, maxHp: bossHp, dir: 1, speed: 1.2, shootCd: 100, hurtCd: 0, phase: 1 };
    return;   
  }   
  cp=10; generateLevel(); respawn(); 
}

function respawn(){p={x:cp,y:220,w:30,h:44,vx:0,vy:0,on:0,f:1,inv:90,boltCd:0};}
function hit(){if(p.inv>0)return;lives--;if(lives<=0){ st='over'; saveHighScore(); }else respawn();}
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function addBolts(amount) {
    score += amount;
    while(score >= 100) {
        score -= 100;
        if (lives < 3) lives++; 
    }
}

function upd(){
  t++;
  
  if (levelStartTimer > 0) {
      levelStartTimer--;
      return; 
  }

  if (repairing) {
      p.vx = 0;
      repairTimer++;
      if (repairTimer > 240) { 
          st = 'pump_fixed';
          cutscene = 0;
      }
      p.vy = Math.min(p.vy+GR,14);
      p.y += p.vy;
      p.on = 0;
      for(const s of solids){
        if (ov(p,s)) {
          if(p.vy > 0) { p.y = s.y - p.h; p.on = 1; }
          p.vy = 0;
        }
      }
      return;
  }

  if (bossDefeated) {
      if (p.x < valveX - 45) {
          p.vx = 1.5; 
      } else {
          p.vx = 0;
          if (valveAngle < 5) {
              valveAngle += 0.03; 
              if (valveAngle > 4.5) waterTimer = 0;
          } else {
              cutscene++;
              if(cutscene > 40) {
                  st = 'boss_win';
                  winAnimTimer = 0;
                  saveHighScore();
                  return;
              }
          }
      }
      p.x += p.vx;
      p.vy = Math.min(p.vy+GR,14);
      p.y += p.vy;
      p.on = 0;
      for(const s of solids){
        if (ov(p,s)) {
          if(p.vy > 0) { p.y = s.y - p.h; p.on = 1; }
          p.vy = 0;
        }
      }
      return; 
  }

  if (speedBoostTimer > 0) speedBoostTimer--;
  if (magnetTimer > 0) magnetTimer--;

  const ax=keys.r-keys.l;
  if(ax)p.f=ax;
  
  let speedMult = 1.5;
  if (selectedChar === 2) speedMult = 1.7; 
  if (speedBoostTimer > 0) speedMult *= 1.6; 
  
  p.vx+=(ax*speedMult-p.vx)*0.15; 
  
  if(keys.j&&p.on){
      if (speedBoostTimer > 0) p.vy = -12.5;
      else if (selectedChar === 2) p.vy = -11.5; 
      else if (selectedChar === 1) p.vy = -8.5; 
      else p.vy = -9; 
      p.on=0;
  } 
  if(!keys.j&&p.vy<-4)p.vy=-4;
  p.vy=Math.min(p.vy+GR,14);
  
  p.x+=p.vx;
  for(const s of solids){
    if (ov(p,s)) { p.x = p.vx > 0 ? s.x - p.w : s.x + s.w; p.vx = 0; }
  }
  if(p.x<0)p.x=0;
  
  p.y+=p.vy;p.on=0;
  for(const s of solids){
    if (ov(p,s)) {
      if(p.vy > 0) { p.y = s.y - p.h; p.on = 1; if(s.g) cp = Math.max(cp, s.x+10); }
      else { p.y = s.y + s.h; }
      p.vy = 0;
    }
  }
  
  if(p.inv>0)p.inv--;
  if(p.y>H+60){p.inv=0;hit();return;}
  cam=Math.max(0,Math.min(LEN-W,p.x-260));
  
  // LEWITACJA ITEMÓW (unoszą się delikatnie w górę i dół)
  for(const it of items) {
      if (!it.got) {
          it.y = it.baseY + Math.sin(t * 0.1 + it.x) * 5;
      }
  }

  for(const c of coins) {
      if(!c.got) {
          let distance = Math.hypot(c.x - (p.x+15), c.y - (p.y+22));
          if (magnetTimer > 0 && distance < 150) {
              c.x += (p.x+15 - c.x) * 0.2;
              c.y += (p.y+22 - c.y) * 0.2;
          }
          if(distance < 28) {
              c.got=1; addBolts(1);
          }
      }
  }
  
  for(const it of items) {
      if (!it.got && ov(p, it)) {
          it.got = true;
          if (it.type === 0) speedBoostTimer = 600; 
          if (it.type === 1) { if (lives < 3) lives++; } 
          if (it.type === 2) magnetTimer = 600; 
      }
  }
  
  for(let i=bolts.length-1;i>=0;i--){
    const b = bolts[i];
    b.x += b.vx; b.y += b.vy || 0; b.life--;
    if(b.life<=0 || b.x<0 || b.x>LEN || b.y<0){ bolts.splice(i,1); continue; }
    
    for(const box of boxes) {
        if (!box.broken && ov({x:b.x, y:b.y, w:4, h:4}, box)) {
            box.broken = true;
            addBolts(box.dropCoins);
            bolts.splice(i,1);
            break;
        }
    }
    
    if(bolts[i] === b) {
        for(const e of en){
          if(e.dead) continue;
          if(Math.abs(b.x - e.x-13)<18 && Math.abs(b.y - e.y-14)<18){
            e.dead = 1; addBolts(5); bolts.splice(i,1); break;
          }
        }
    }
  }

  for(const e of en){
    if(e.dead)continue;
    e.x+=e.d*0.6; 
    if(e.x<e.a||e.x>e.b)e.d*=-1;
    
    let eb = {x:e.x, y:e.y, w:26, h:22};
    for (const s of solids) {
        if(s.h > 40 && !s.g && ov(eb, s)) {
            if(e.d > 0) { e.x = s.x - 26; e.d = -1; }
            else { e.x = s.x + s.w; e.d = 1; }
            eb.x = e.x;
        }
    }

    if(ov(p,eb)){
      if(p.vy>1&&p.y+p.h-p.vy<=e.y+10){e.dead=1;p.vy=-6;addBolts(3);}
      else hit();
      if(st!=='play')return;
    }
  }
  
  if(keys.f && !p.boltCd){
    let vy = (level % 4 === 3) ? -4 : 0; 
    let vx = p.f * 8;
    
    if (selectedChar === 1) {
        bolts.push({x:p.x+10, y:p.y+22, vx:vx, vy:vy, life:40, w:10, h:10});
        bolts.push({x:p.x+20, y:p.y+22, vx:vx, vy:vy, life:40, w:10, h:10});
    } else if (selectedChar === 2) {
        bolts.push({x:p.x+15, y:p.y+22, vx:vx*0.6, vy:vy, life:15, w:6, h:6});
    } else {
        bolts.push({x:p.x+15, y:p.y+22, vx:vx, vy:vy, life:60, w:6, h:6});
    }
    p.boltCd = 20;
  }
  if(p.boltCd) p.boltCd--;

  if (level % 4 === 3 && boss) {
    if (bossDying > 0) {
       bossDying++;
       if (bossDying > 120) { 
           addBolts(100 + world*10);
           boss = null; bossBolts = []; 
           bossDefeated = true; 
           cutscene = 0;
           return;
       }
       return;
    }

    boss.x += boss.dir * boss.speed;
    if (boss.x < 20) { boss.x = 20; boss.dir = 1; }
    if (boss.x > W - boss.w - 20) { boss.x = W - boss.w - 20; boss.dir = -1; }

    if (boss.shootCd > 0) boss.shootCd--;
    if (boss.shootCd <= 0) {
      bossBolts.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, vy: 2.5, vx: 0 });
      boss.shootCd = 100 - Math.min(world * 10, 40);
    }

    for (let i = bossBolts.length - 1; i >= 0; i--) {
      const bb = bossBolts[i];
      bb.y += bb.vy; bb.x += bb.vx;
      if (bb.y > H + 20) { bossBolts.splice(i, 1); continue; }
      if (ov(p, {x: bb.x - 8, y: bb.y - 8, w: 16, h: 16})) {
        bossBolts.splice(i, 1); hit();
        if (st !== 'play') return;
      }
    }

    if (boss.hurtCd > 0) boss.hurtCd--;
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      if (ov({x: b.x, y: b.y, w: b.w||4, h: b.h||4}, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
        bolts.splice(i, 1);
        if (boss.hurtCd <= 0) {
          boss.hp--; boss.hurtCd = 15;
          if (boss.hp <= boss.maxHp / 2 && boss.phase === 1) { boss.phase = 2; boss.speed += 1; boss.shootCd = 40; }
          if (boss.hp <= 0) { bossDying = 1; return; }
        }
      }
    }
    if (ov(p, boss)) { hit(); if (st !== 'play') return; }
  }

  if(level % 4 !== 3 && ov(p,goal) && !repairing){
    repairing = true;
    repairTimer = 0;
    p.x = goal.x - 25;
  }
}

function hex(x,y,r){g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i;g.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}g.closePath();}
function txt(s,x,y,size,col,al){g.font='700 '+size+'px "Trebuchet MS",system-ui,sans-serif';g.textAlign=al||'center';g.fillStyle=col;g.fillText(s,x,y);}

function drawPlayer(x, y, charId, flipping, isWalking, animT) {
    const s = isWalking ? Math.sin(animT * 0.4) * 3 : 0;
    let colorPants, colorShirt, colorHelmet;
    
    if (charId === 0) { colorPants = '#233b5c'; colorShirt = '#2f6fb5'; colorHelmet = '#f2c230'; }
    else if (charId === 1) { colorPants = '#5c2323'; colorShirt = '#b52f2f'; colorHelmet = '#f2a230'; }
    else { colorPants = '#2d4a2d'; colorShirt = '#2eb82e'; colorHelmet = '#f2e230'; }

    g.fillStyle = colorPants; g.fillRect(x + 5, y + 34, 8, 10 - (s > 0 ? 2 : 0)); g.fillRect(x + 17, y + 34, 8, 10 - (s < 0 ? 2 : 0));
    g.fillStyle = colorShirt; g.fillRect(x + 4, y + 18, 22, 16);
    g.fillStyle = '#f0c8a0'; g.fillRect(x + 7, y + 6, 16, 12);
    g.fillStyle = colorHelmet; g.fillRect(x + 5, y, 20, 8); g.fillRect(flipping > 0 ? x + 5 : x, y + 6, 25, 3);
    g.fillStyle = '#222'; g.fillRect(x + (flipping > 0 ? 16 : 11), y + 10, 3, 3);
    g.fillStyle = '#c9ccd1'; g.fillRect(flipping > 0 ? x + 24 : x - 5, y + 22, 10, 4);
}

function draw(){
  const env = getEnvColors();
  const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,env.skyTop);sk.addColorStop(1,env.skyBot);
  g.fillStyle=sk;g.fillRect(0,0,W,H);
  
  if(st === 'select') {
      g.fillStyle = 'rgba(10,20,30,0.9)'; g.fillRect(0,0,W,H);
      txt('WYBIERZ INSTALATORA', W/2, 40, 36, '#f0a06a', 'center');
      
      let c1 = selectedChar === 0 ? '#f2c94c' : 'rgba(255,255,255,0.1)';
      g.fillStyle = c1; g.fillRect(80, 80, 180, 200);
      drawPlayer(155, 100, 0, 1, false, 0);
      txt('MARCIN', 170, 220, 20, selectedChar === 0 ? '#000' : '#fff');
      txt('Zrównoważony', 170, 240, 12, selectedChar === 0 ? '#222' : '#aaa');
      txt('Rekord: ' + highScores[0], 170, 260, 16, selectedChar === 0 ? '#222' : '#aaa');
      
      let c2 = selectedChar === 1 ? '#f2c94c' : 'rgba(255,255,255,0.1)';
      g.fillStyle = c2; g.fillRect(310, 80, 180, 200);
      drawPlayer(385, 100, 1, 1, false, 0);
      txt('DANIEL', 400, 220, 20, selectedChar === 1 ? '#000' : '#fff');
      txt('Siła ognia (2x piorun)', 400, 240, 12, selectedChar === 1 ? '#222' : '#aaa');
      txt('Rekord: ' + highScores[1], 400, 260, 16, selectedChar === 1 ? '#222' : '#aaa');
      
      let c3 = selectedChar === 2 ? '#f2c94c' : 'rgba(255,255,255,0.1)';
      g.fillStyle = c3; g.fillRect(540, 80, 180, 200);
      drawPlayer(615, 100, 2, 1, false, 0);
      txt('KRZYSIEK', 630, 220, 20, selectedChar === 2 ? '#000' : '#fff');
      txt('Skoczek (wysoki skok)', 630, 240, 12, selectedChar === 2 ? '#222' : '#aaa');
      txt('Rekord: ' + highScores[2], 630, 260, 16, selectedChar === 2 ? '#222' : '#aaa');
      
      txt('Użyj ◀ ▶ aby wybrać, ▲ lub ⚡ aby zatwierdzić', W/2, 310, 16, '#cfd8df', 'center');
      return; 
  }
  
  g.save(); 
  
  g.fillStyle=env.bld;
  for(let i=0;i<10;i++){
      const x=((i*260-cam*0.4)%2600+2600)%2600-150;
      g.fillRect(x,190,90,90);
      g.beginPath();g.moveTo(x-8,190);g.lineTo(x+45,145);g.lineTo(x+98,190);g.fill();
  }
  
  if(logo.complete && logo.naturalWidth) {
    for(let i=0;i<6;i++){
      const x=((i*700-cam*0.6)%4200+4200)%4200-250;
      g.fillStyle='#2a3a4a'; g.fillRect(x+25, 100, 8, 160); g.fillRect(x+157, 100, 8, 160);
      g.fillStyle='#f4f6f8'; g.fillRect(x, 50, 190, 80); g.strokeStyle='#8fa3b3'; g.lineWidth=3; g.strokeRect(x, 50, 190, 80);
      g.drawImage(logo, x+5, 65, 180, 50);
    }
  }
    
  g.translate(-Math.round(cam),0);
  
  for(const s of solids){
    if(s.g){ g.fillStyle=env.grnd;g.fillRect(s.x,s.y,s.w,s.h); g.fillStyle='#d9733a';g.fillRect(s.x,s.y,s.w,7); g.fillStyle='#a8531f';g.fillRect(s.x,s.y+7,s.w,2); }
    else if(s.isBox) { g.fillStyle='#4a2e15'; g.fillRect(s.x, s.y, s.w, s.h); g.strokeStyle='#2a1a0a'; g.lineWidth=2; for(let i=s.y; i<s.y+s.h; i+=20) g.strokeRect(s.x, i, s.w, 20); }
    else { g.fillStyle='#d9733a';g.fillRect(s.x,s.y,s.w,s.h); g.fillStyle='#f0a06a';g.fillRect(s.x,s.y+2,s.w,3); g.fillStyle='#8f4418'; for(let x=s.x+14;x<s.x+s.w-6;x+=28)g.fillRect(x,s.y-2,6,s.h+4); }
  }
  
  for(const box of boxes) {
      if (!box.broken) {
          g.fillStyle = '#d4a373'; 
          g.fillRect(box.x, box.y, box.w, box.h);
          g.strokeStyle = '#8b5a2b'; 
          g.lineWidth = 2;
          g.strokeRect(box.x, box.y, box.w, box.h);
          txt('?', box.x + box.w/2, box.y + box.h/2 + 8, 24, '#fff', 'center');
      }
  }

  for(const it of items) {
      if (!it.got) {
          // Rysujemy używając it.y, które jest modyfikowane w upd (lewituje)
          if (it.type === 0) { // Turbo-Bateria
              g.fillStyle = '#f2c94c'; g.fillRect(it.x, it.y, it.w, it.h);
              g.fillStyle = '#222'; txt('⚡', it.x+12, it.y+18, 16, '#222', 'center');
          } else if (it.type === 1) { // Apteczka
              g.fillStyle = '#e02a2a'; g.fillRect(it.x, it.y, it.w, it.h);
              g.fillStyle = '#fff'; g.fillRect(it.x+9, it.y+4, 6, 16); g.fillRect(it.x+4, it.y+9, 16, 6);
          } else if (it.type === 2) { // Magnes
              g.fillStyle = '#3fa7e0'; g.fillRect(it.x, it.y, it.w, it.h);
              g.fillStyle = '#fff'; g.beginPath(); g.arc(it.x+12, it.y+12, 6, 0, Math.PI); g.stroke();
          }
      }
  }

  if (level % 4 === 3) {
      g.fillStyle = '#555'; g.fillRect(valveX - 15, 0, 30, valveY);
      g.fillStyle = '#999'; g.beginPath(); g.arc(valveX, valveY, 25, 0, 7); g.fill();
      
      if (waterTimer > 0) {
          g.fillStyle = 'rgba(63,167,224,0.7)';
          for(let i=0; i<waterTimer; i++) {
              let wY = valveY + 20 + i * 15;
              if(wY < 280) {
                  g.beginPath(); g.ellipse(valveX, wY, 15 + Math.sin(t*0.2+i)*5, 10, 0, 0, 7); g.fill();
              }
          }
      }
      
      g.save(); g.translate(valveX, valveY); g.rotate(valveAngle);
      g.strokeStyle = '#333'; g.lineWidth = 8;
      g.beginPath(); g.moveTo(-15, 0); g.lineTo(15, 0); g.moveTo(0, -15); g.lineTo(0, 15); g.stroke();
      g.restore();
      txt('ZAWÓR', valveX, valveY - 35, 12, '#fff', 'center');
  }
  
  if (level % 4 !== 3) {
    g.fillStyle='#dfe6ea';g.fillRect(goal.x,goal.y,goal.w,goal.h);g.fillStyle='#9aa7b0';g.fillRect(goal.x,goal.y+goal.h-8,goal.w,8);
    g.save();g.translate(goal.x+35,goal.y+38);g.fillStyle='#4b5862';for(let i=0;i<4;i++){g.rotate(Math.PI/2);g.fillRect(-4,0,8,26);}g.restore();
    g.strokeStyle='#4b5862';g.lineWidth=3;g.beginPath();g.arc(goal.x+35,goal.y+38,30,0,7);g.stroke();
    txt('POMPA CIEPŁA',goal.x+35,goal.y-10,14,'#fff');

    if(repairing && repairTimer % 10 < 5) {
        g.fillStyle='#f2c94c'; g.fillRect(goal.x+10, goal.y+50, 5, 5); g.fillRect(goal.x+60, goal.y+60, 4, 4); g.fillRect(goal.x+25, goal.y+70, 6, 6);
    }
  }
  
  for(const c of coins){if(c.got)continue;const y=c.y+Math.sin(t*0.08+c.x)*3;g.fillStyle='#f2c94c';hex(c.x,y,10);g.fill();g.fillStyle='#8a6a10';g.beginPath();g.arc(c.x,y,4,0,7);g.fill();}
  for(const e of en){if(e.dead)continue;g.fillStyle='#3fa7e0';g.beginPath();g.ellipse(e.x+13,e.y+14,13,9,0,0,7);g.fill();g.beginPath();g.moveTo(e.x+5,e.y+10);g.lineTo(e.x+13,e.y-2);g.lineTo(e.x+21,e.y+10);g.fill();g.fillStyle='#fff';g.fillRect(e.x+7,e.y+10,5,5);g.fillRect(e.x+15,e.y+10,5,5);g.fillStyle='#10304a';g.fillRect(e.x+9,e.y+12,2,3);g.fillRect(e.x+17,e.y+12,2,3);}
  
  for(const b of bolts){
    let bw = b.w || 6; let bh = b.h || 6;
    g.fillStyle='#f2c94c';g.beginPath();g.moveTo(b.x, b.y-bh);g.lineTo(b.x+bw, b.y);g.lineTo(b.x, b.y+bh);g.lineTo(b.x-bw, b.y);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=1;g.stroke();
  }
  
  if(!(p.inv>0&&(t>>2)%2) && (st==='play' || bossDefeated || repairing)){
    let fixOffset = 0;
    if(repairing) {
        fixOffset = Math.sin(t * 0.3) * 5;
        g.fillStyle='#999'; g.fillRect(p.x+25, p.y+25 + fixOffset, 15, 4);
        g.fillStyle='#ccc'; g.fillRect(p.x+37, p.y+22 + fixOffset, 6, 10);
    }
    drawPlayer(p.x, p.y, selectedChar, p.f, (Math.abs(p.vx)>0.5&&p.on), t);
    
    if (magnetTimer > 0) {
        g.strokeStyle = 'rgba(63,167,224,0.5)';
        g.lineWidth = 2;
        g.beginPath(); g.arc(p.x+15, p.y+22, 30 + Math.sin(t*0.2)*5, 0, 7); g.stroke();
    }
  }

  g.restore(); 

  if (level % 4 === 3 && boss) {
    if (bossDying > 0) {
        let fallY = boss.y + Math.pow(bossDying/10, 2); 
        let flash = Math.floor(bossDying/5) % 2 === 0;
        g.fillStyle = flash ? '#ff3333' : '#1a5c8a'; g.fillRect(boss.x, fallY, boss.w, boss.h);
    } else {
        g.fillStyle = '#1a5c8a'; g.fillRect(boss.x, boss.y, boss.w, boss.h);
        g.strokeStyle = '#3fa7e0'; g.lineWidth = 4; g.strokeRect(boss.x + 4, boss.y + 4, boss.w - 8, boss.h - 8);
        g.fillStyle = '#ff3333'; g.fillRect(boss.x + 25, boss.y + 25, 20, 15); g.fillRect(boss.x + boss.w - 45, boss.y + 25, 20, 15);
        g.fillStyle = '#000'; g.fillRect(boss.x + 30, boss.y + 55, boss.w - 60, 10);
        if (geoecoLogo.complete) g.drawImage(geoecoLogo, boss.x + boss.w/2 - 25, boss.y + 35, 50, 25);
        const barW = 400; const barH = 20; const barX = W/2 - barW/2; const barY = 30; 
        g.fillStyle = '#222'; g.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
        g.fillStyle = '#e02a2a'; g.fillRect(barX, barY, barW * (boss.hp / boss.maxHp), barH);
        txt('GEOECO ENERGIA - BOSS', W/2, barY - 10, 16, '#fff', 'center');
    }
    for (const bb of bossBolts) {
      g.fillStyle = '#3fa7e0'; g.beginPath(); g.ellipse(bb.x, bb.y, 8, 12, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(bb.x - 3, bb.y - 3, 3, 0, 7); g.fill();
    }
  }

  txt('Śruby: '+score,14,24,18,'#f2c94c','left');
  txt('Świat: '+world+' - '+(level%4 + 1),W/2,24,18,'#fff','center');
  txt('Życia: '+'♥'.repeat(Math.max(lives,0)),W-14,24,18,'#ff8a7a','right');
  
  if (speedBoostTimer > 0) txt('TURBO', W-14, 50, 14, '#f2c94c', 'right');
  if (magnetTimer > 0) txt('MAGNES', W-14, 70, 14, '#3fa7e0', 'right');
  
  if (levelStartTimer > 0) {
      g.fillStyle = 'rgba(10,20,30,0.85)'; g.fillRect(0, 0, W, H);
      txt('ŚWIAT ' + world + ' - ' + (level%4 + 1), W/2, H/2 - 10, 46, '#f2c94c', 'center');
      if(level % 4 === 3) txt('UWAGA: BOSS!', W/2, H/2 + 40, 24, '#ff8a7a', 'center');
      else txt('Przygotuj się...', W/2, H/2 + 40, 20, '#fff', 'center');
  }

  if(st === 'pump_fixed') {
    g.fillStyle = 'rgba(10,20,30,0.85)'; g.fillRect(0,0,W,H);
    let offset = Math.max(0, 200 - cutscene * 3);
    txt('SUKCES!', W/2, 110 + offset, 40, '#7ac74f');
    txt('Naprawiono kolejną pompę ciepła!', W/2, 160 + offset, 24, '#fff');
    txt('Świat ' + world + ' - ' + (level%4 + 1) + ' ukończony.', W/2, 200 + offset, 18, '#f2c94c');
    
    if(cutscene > 60) {
        txt('Dotknij ekranu lub przycisku START aby przejść dalej...', W/2, 290, 16, '#cfd8df', 'center');
    }
    cutscene++;
  }
  
  else if(st==='boss_win') {
    g.fillStyle='rgba(10,20,30,.9)';g.fillRect(0,0,W,H);
    winAnimTimer++;
    let textOffset = Math.max(0, 300 - winAnimTimer * 5);
    
    txt('BOSS POKONANY!',W/2, 90 + textOffset,40,'#7ac74f');
    txt('Gratulacje!',W/2, 140 + textOffset,26,'#fff');
    txt('Udało Ci się obalić kolejnego bossa hydraulika GeoEco!',W/2, 175 + textOffset,18,'#f2c94c');
    txt('Wynik: '+score,W/2, 230 + textOffset,24,'#fff');
    
    if(winAnimTimer > 60) {
        txt('Dotknij ekranu, aby przejść do Świata ' + (world + 1),W/2, 290,20,'#f2c94c');
    }
  } 
  
  else if(st==='over'){
    g.fillStyle='rgba(10,20,30,.95)';g.fillRect(0,0,W,H);
    
    let isFlash = (t >> 4) % 2 === 0;
    txt('KONIEC GRY',W/2, 70, 46, isFlash ? '#ff3333' : '#8f0000');
    txt('Błąd krytyczny!',W/2, 110, 24, '#fff');
    
    txt('Dotarłeś do poziomu: '+(world)+' - '+(level%4+1),W/2, 150, 18, '#cfd8df');
    txt('Twój wynik: '+score,W/2, 180, 22, '#f2c94c');
    txt('Najlepszy wynik: '+highScores[selectedChar],W/2, 210, 18, '#7ac74f');
    
    txt('Co chcesz zrobić?', W/2, 250, 20, '#fff');
    txt('Kontynuuj (Zagraj od nowa)', W/2, 285, 18, '#f2c94c');
    txt('Zmień instalatora (Menu)', W/2, 315, 18, '#cfd8df');
  } else if(st==='menu') {
      txt('INSTALATOREK',W/2,120,46,'#f0a06a');
  }
}

function loop(){
    if(st==='play') upd();
    draw();
    requestAnimationFrame(loop);
}

function start(){   
  if (st === 'select') {
      level=0; world=1; score=0; lives=3; 
      init(); st='play'; 
      return;
  }
  
  if(st === 'pump_fixed' && cutscene > 60) {
      level++;
      world = Math.floor(level / 4) + 1;
      init(); 
      st = 'play';
      return;
  }
  
  if (st === 'boss_win' && winAnimTimer > 60) {
      world++;
      level = (world - 1) * 4; 
      init(); st = 'play';
      return;
  }

  if(st==='over'){
      if (keys.l) {
          st = 'select'; 
      } else {
          level=0; world=1; score=0; lives=3; 
          init(); st='play'; 
      }
      return;
  }
}

function bind(id,k){const b=document.getElementById(id);
  const on=e=>{
      e.preventDefault();
      keys[k]=1;
      if (st === 'select' && k === 'l') selectedChar = (selectedChar + 2) % 3;
      if (st === 'select' && k === 'r') selectedChar = (selectedChar + 1) % 3;
      if (st === 'select' && (k === 'j' || k === 'f')) start();
      else if (st !== 'select' && (k === 'j' || k === 'f')) start();
      else if (st === 'over') start();
  },off=e=>{e.preventDefault();keys[k]=0;};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,off));}

bind('l','l');bind('r','r');bind('j','j');bind('f','f');
cv.addEventListener('pointerdown',start);
const map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyK:'f',KeyJ:'f'};
addEventListener('keydown',e=>{
    const k=map[e.code];
    if(k){
        keys[k]=1;
        e.preventDefault();
        if (st === 'select' && (e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
            if(e.code === 'ArrowLeft') selectedChar = (selectedChar + 2) % 3;
            else selectedChar = (selectedChar + 1) % 3;
        }
        if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyW') start();
    }
    if(e.code==='Enter')start();
});
addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=0;});
document.addEventListener('contextmenu',e=>e.preventDefault());

init();st='select';loop();
</script>
